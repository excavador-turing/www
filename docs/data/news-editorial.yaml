# Written ahead of the release, as the rules allow; the post appears when
# v2.35.0 exists.
v2.35.0:
  title: A fixed address from the Network tab, and a clock that says why
  summary: >-
    The BMC's own address — DHCP or static, with gateway and resolvers — from
    the Network tab, applied then confirmed at the new address so a typo
    cannot strand the board. The Time card lists every source with chrony's
    own verdict, including the one that sent a reader to Discord: a name the
    board could not resolve. And two 2.4 boards now run this firmware, one
    upgraded from the factory image in NAND.
  video: captures/news/address-apply.mp4
  video_caption: >-
    Recorded in this site's own demo: a static address typed in, applied,
    and kept only after the page confirms it. Then the same change left
    alone, so the board puts the old address back by itself.
  capture: captures/news/address.png
  caption: The Network tab — the BMC's address beside its name, with the same apply-then-confirm as the switch.

# v2.36.0 -- the resolver hook. The address card's stanza carried a '#', the
# board's ifup read it as a comment, and a static address lost its resolvers
# at every reboot. One reader found it the day after v2.35.0 shipped.
v2.36.0:
  title: Two ways a board with no DNS failed to mention it
  summary: >-
    A static address came back from every reboot with no resolvers, because
    the stanza that rebuilds them carried a `#` the board's ifup read as a
    comment. And the firmware check said "nothing new" rather than "I could
    not reach anything", because the updater printed an empty list and
    exited 0. One reader found both, the day after v2.35.0 shipped, on a
    board that simply had no DNS. Boards the old stanza was already written
    to repair themselves.

# v2.37.0 -- the password form could not be typed into, reported as #48 by a
# user who had to fall back to SSH. The release also carries the gate that
# would have caught it.
v2.37.0:
  title: The password form could not be typed into, and nothing noticed
  summary: >-
    Three boxes that looked normal, focused normally, and refused every
    character — including on the page a board shows before it will do
    anything else, so a board on its factory password could not be taken
    off it from a browser at all. Reported by a user who worked it out and
    used SSH instead. The release also carries the gate that would have
    caught it: the interface's CI now types into every box of every tab.

# v2.38.0 -- a reader's suggestion after doing an update once: the page said
# nothing while the board installed. Interface only; the daemon is unchanged.
v2.38.0:
  title: The page now says what the board is doing while it installs
  summary: >-
    Installing from the Firmware tab took about half a minute of silence —
    a greyed button and nothing else — and a reader wondered whether to
    refresh. Now the button says Installing and a status line counts
    "about 26 s, now at N", measured on a real board like the reboot
    banner's number. Nothing is armed until the board says staged, and the
    page says that too.
