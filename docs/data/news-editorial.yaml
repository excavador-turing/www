# What a post says that the changelog cannot: a headline, a summary, a
# picture. Keyed by firmware tag. Every key is optional -- a release with no
# entry here still gets a post, titled by its version and led by its own
# changelog paragraph -- so the hourly job never waits on a person.
#
#   title:    a sentence about what the release does, not its number
#   summary:  one or two sentences; the post's excerpt on the news index and
#             the front page's What's-new line
#   capture:  a path under docs/assets/, taken from the demo build of the
#             BMC-UI the release carries (the real interface on captured
#             fixtures), never drawn
#   caption:  what the picture shows

v2.33.0:
  title: The board's switch gets VLANs, and the board asks for a password
  summary: >-
    VLANs on the board's own switch, tried before they are kept; a certificate
    endpoint; and a board still on the factory password now insists you change
    it before it will do anything else.
  capture: captures/news/switch.png
  caption: The Network tab — the switch as a table, a preset to start from, and Apply beside Try it, which undoes itself.

v2.34.0:
  title: Pick a module with one click
  summary: >-
    Console, USB and Flash each asked which module with a drop-down that
    unfolded to show four fixed entries. They now show the four side by side,
    the chosen one green — on the board and in the fleet, which render the
    same components.
  capture: captures/news/console-picker.png
  caption: The Console tab — Node 1 to 4 as pills, where a drop-down used to be.
