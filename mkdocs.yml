# One site, one repository: GitHub Pages binds a custom domain per repo, so
# excavador.xyz, homelab.excavador.xyz and turingpi.xyz cannot share
# one. INHERIT worked across directories and cannot work across repositories;
# the block below is generated into each of the three and drifts if edited in
# only one.
site_name: Turing Pi 2 BMC
site_description: A fork of the Turing Pi 2 BMC firmware, and what it changes
site_url: https://turingpi.xyz
repo_url: https://github.com/excavador-turing/BMC-Firmware
edit_uri: ""
docs_dir: docs
site_dir: site

# A Feature argues, a Guide instructs, a Reference lists. The numbers live in
# Reference so the articles link to evidence rather than restating it -- an
# earlier draft carried a hand-counted promotion total in three places and all
# three had drifted apart by the time a metric could check them.
nav:
  - Home: index.md
  - Try it: demo/index.md
  - Features:
      - Overview: features/index.md
      - One page over every board: features/one-page-over-every-board.md
      - Fresh, and fixed: features/fresh-and-fixed.md
      - Update without touching your nodes: features/update-without-touching-your-nodes.md
      - Updates that undo themselves: features/updates-that-undo-themselves.md
      - See what the board sees: features/see-what-the-board-sees.md
      - Pick a version, from anywhere: features/pick-a-version.md
      - A console to every module: features/a-console-to-every-module.md
      - A certificate that does not rot: features/a-certificate-that-does-not-rot.md
      - The board describes its own API: features/the-board-describes-itself.md
      - Flash a module from the card: features/flash-from-the-card.md
      - The arguments:
          - One page over every board: why/one-page-over-every-board.md
          - Fresh, and fixed: why/fresh-and-fixed.md
          - Update without touching your nodes: why/update-without-touching-your-nodes.md
          - Updates that undo themselves: why/updates-that-undo-themselves.md
          - See what the board sees: why/see-what-the-board-sees.md
          - Pick a version, from anywhere: why/pick-a-version.md
          - A console to every module: why/a-console-to-every-module.md
          - A certificate that does not rot: why/a-certificate-that-does-not-rot.md
          - The board describes its own API: why/the-board-describes-itself.md
          - Flash a module from the card: why/flash-from-the-card.md
  - Guides:
      - Overview: guides/index.md
      - Install: guides/install.md
      - Upgrading from stock: guides/upgrade-from-stock.md
      - Recover a bad flash: guides/recover-a-bad-flash.md
      - Monitor it: guides/monitor-it.md
      - Developing: guides/development.md
  - Reference:
      - Upstream vs this fork: reference/comparison.md
      - The factory firmware: reference/factory-firmware.md
      - Command line: reference/cli.md
      - Metrics: reference/metrics.md
      - API:
          - The API: reference/api.md
          - Every operation: reference/api/index.md
          - What each release's API had: reference/api-history.md
          - The board: reference/api/board.md
          - The nodes: reference/api/nodes.md
          - Firmware: reference/api/firmware.md
          - Storage: reference/api/storage.md
          - Network and time: reference/api/network.md
          - Cooling and thermals: reference/api/thermal.md
      - The gate's record: reference/gate-history.md
      - What is and isn't fixed: reference/known-faults.md
  - Changelog:
      - Overview: changelog/index.md
      - BMC-Firmware: changelog/firmware.md
      - bmcd: changelog/bmcd.md
      - BMC-UI: changelog/bmc-ui.md
      - tpi: changelog/tpi.md
  - Roadmap: roadmap.md
  - About: about.md
  - Contributing: contributing.md

theme:
  name: material
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.suggest
    - search.highlight
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle: {icon: material/brightness-auto, name: follow the system}
    # The board's own palette: near-black chrome, a lime accent. Indigo is
    # Material's default and matches nothing the reader will see on the board.
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle: {icon: material/brightness-7, name: dark}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle: {icon: material/brightness-4, name: light}

extra_css:
  - stylesheets/landing.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.highlight: {anchor_linenums: true}
  - pymdownx.inlinehilite
  - pymdownx.snippets

plugins:
  - search
  # neoteroi.mkdocsoad is GONE (2026-09-10). It was chosen over Scalar for a
  # good reason -- it emitted real HTML that search could index, where Scalar
  # is one un-indexable widget -- and that reason still stands. What it could
  # not do is be navigated: it renders HTML after MkDocs has built the table
  # of contents, so its 176 headings never entered it. The result was one
  # 106,000-pixel page whose contents listed three entries.
  #
  # scripts/generate-api-pages.py now emits Markdown instead, which keeps the
  # indexability and adds the navigation: real headings, real nav, one page
  # per group. Same document, same generator-owns-it rule.
  # Every page says when it was last touched. These sites describe a moving
  # target -- repositories that release often -- and a doc page with no date
  # invites the reader to assume it is current.
  - git-revision-date-localized:
      enable_creation_date: false
      fallback_to_build_date: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/excavador-turing
