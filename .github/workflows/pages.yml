name: Pages

# Every push builds with --strict (a broken internal link fails the run);
# only main deploys. GitHub Pages is artifact-based by design: the build job
# uploads, the deploy job publishes, and the two never share a runner.
#
# The live demo's fork pane is NOT in this repository. It is built here, at
# every deploy, from the LATEST release of excavador-turing/BMC-UI -- so the
# site always shows the interface that was last released, and a release
# there is what makes this site stale, not a commit here. That release
# tells us (repository_dispatch, from BMC-UI's release.yaml); the hourly
# schedule is the safety net for when it could not, and does nothing when
# the site already carries the latest tag.
on:
  push:
    branches: [main]
  pull_request:
  # Re-publishing without a commit: setting a custom domain does not itself
  # redeploy, and a deployment is what re-binds the domain at GitHub's edges.
  workflow_dispatch:
  repository_dispatch:
    types: [ui-released]
  schedule:
    - cron: "23 * * * *"

concurrency:
  # Not cancel-in-progress: cancelling a half-finished Pages deployment
  # leaves the site on whichever version happened to land first.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.ui.outputs.skip }}
      tag: ${{ steps.ui.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The revision-date plugin reads git history; a shallow clone makes
          # every page claim it was written at build time.
          fetch-depth: 0
          # Media is in LFS (.gitattributes). Without this, checkout leaves
          # 130-byte pointer files and the site publishes those AS the images
          # -- a build that succeeds and a page that is broken, which is the
          # worst combination. It costs nothing while no media exists yet.
          lfs: true

      # Which interface the site should show: the latest published, non-draft,
      # non-prerelease BMC-UI release. On the schedule, compare with what the
      # site already serves and stop if they agree -- a deploy of the same
      # bytes every hour is noise in the deployment history.
      - name: latest BMC-UI release
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/excavador-turing/BMC-UI/releases/latest --jq .tag_name)
          live=$(curl -fsS --max-time 15 https://turingpi.xyz/demo/fork/VERSION 2>/dev/null || echo none)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$tag" = "$live" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "the site already carries $tag; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "building the demo from $tag (the site carries $live)"
          fi

      - name: BMC-UI at that release
        if: steps.ui.outputs.skip != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: excavador-turing/BMC-UI
          ref: ${{ steps.ui.outputs.tag }}
          path: bmc-ui

      - name: node, as BMC-UI pins it
        if: steps.ui.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: bmc-ui/.nvmrc
          cache: npm
          cache-dependency-path: bmc-ui/package-lock.json

      - name: build the fork demo
        if: steps.ui.outputs.skip != 'true'
        working-directory: bmc-ui
        env:
          VITE_DEMO: "1"
          VITE_BASE: /demo/fork/
          BMC_UI_VERSION: ${{ steps.ui.outputs.tag }}
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm run build

      # Prove the bundle is a demo before publishing it. A release without
      # the demo mode builds just as green and then, framed on the front
      # page, tries to talk to a board that is not there.
      - name: place it, prove it, give it a way out
        if: steps.ui.outputs.skip != 'true'
        run: |
          set -eu
          rm -rf docs/demo/fork
          mkdir -p docs/demo/fork
          cp -a bmc-ui/dist/. docs/demo/fork/
          echo "${{ steps.ui.outputs.tag }}" > docs/demo/fork/VERSION
          if ! grep -rqlF "a recording, not a live stream" docs/demo/fork/assets; then
            echo "${{ steps.ui.outputs.tag }} built without its demo mode; refusing to publish it as one" >&2
            exit 1
          fi
          python3 scripts/demo-ribbon.py
          echo "fork pane: ${{ steps.ui.outputs.tag }} ($(find docs/demo/fork -type f | wc -l) files)"

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: steps.ui.outputs.skip != 'true'

      - name: install
        if: steps.ui.outputs.skip != 'true'
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: build, strict
        if: steps.ui.outputs.skip != 'true'
        run: .venv/bin/mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.ui.outputs.skip != 'true'
        with:
          path: site

  deploy:
    # A pull request from a fork must never publish. Deploy is main-only:
    # a push to main, a dispatch from a BMC-UI release, the hourly catch-up
    # when it found something new, or a hand on the button.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && needs.build.outputs.skip != 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
