name: Pages

# This publishes. It does not judge: every check moved to `checks.yml`,
# which runs on pull requests and blocks the merge instead. The screen gate
# alone was 132 of the 178 seconds a deploy took, while building the site
# itself took 3 -- two minutes of a browser measuring pages that had already
# been measured on the pull request that changed them.
#
# GitHub Pages is artifact-based by design: the build job uploads, the deploy
# job publishes, and the two never share a runner.
#
# The live demo's fork pane is NOT in this repository. It is built here, at
# every deploy, from the LATEST release of excavador-turing/BMC-UI -- so the
# site always shows the interface that was last released, and a release
# there is what makes this site stale, not a commit here. That release
# tells us (repository_dispatch, from BMC-UI's release.yaml); the hourly
# schedule is the safety net for when it could not, and does nothing when
# the site already carries the latest tag.
on:
  push:
    branches: [main]
  # Re-publishing without a commit: setting a custom domain does not itself
  # redeploy, and a deployment is what re-binds the domain at GitHub's edges.
  workflow_dispatch:
  repository_dispatch:
    types: [ui-released]
  schedule:
    - cron: "23 * * * *"

concurrency:
  # Not cancel-in-progress: cancelling a half-finished Pages deployment
  # leaves the site on whichever version happened to land first.
  group: pages
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The generated pages -- changelog, roadmap, facts -- are committed, so the
  # site builds offline and a change to them arrives as a reviewable diff.
  # The cost of that is somebody has to run the scripts, and nobody did: the
  # site sat on firmware v2.31.0 for a week after v2.32.0 shipped, while the
  # version badge in its own header said v2.32.0.
  #
  # So the hourly job does it. Only on the schedule and by hand -- a push
  # already carries whatever the author committed, and refreshing under them
  # would rewrite it.
  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: install
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: read the sources
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          .venv/bin/python scripts/refresh-changelog.py
          .venv/bin/python scripts/refresh-roadmap.py
          .venv/bin/python scripts/facts.py

      - name: commit, if anything moved
        id: commit
        run: |
          set -eu
          if git diff --quiet -- docs/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "nothing moved"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -F - <<'MSG'
          the site catches up with what the repositories say

          Written by scripts/refresh-changelog.py, refresh-roadmap.py and
          scripts/facts.py on the hourly Pages schedule. Nothing here is
          typed by hand.
          MSG
          # A push authenticated with GITHUB_TOKEN does not start another
          # workflow run, which is why the build job below checks main out
          # again rather than leaving the deploy to a push event that will
          # never arrive.
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
          git --no-pager diff --stat HEAD~1 -- docs/

  build:
    needs: [refresh]
    # `needs` on a job that was skipped skips this one too, and a push must
    # still build.
    if: ${{ !cancelled() && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.ui.outputs.skip }}
      tag: ${{ steps.ui.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # main, not the commit this run started from: the refresh job above
          # may have pushed to it, and that commit is the whole point of the
          # run when it happens.
          ref: main
          # The revision-date plugin reads git history; a shallow clone makes
          # every page claim it was written at build time.
          fetch-depth: 0
          # Media is in LFS (.gitattributes). Without this, checkout leaves
          # 130-byte pointer files and the site publishes those AS the images
          # -- a build that succeeds and a page that is broken, which is the
          # worst combination. It costs nothing while no media exists yet.
          lfs: true

      # Which interface the site should show: the latest published, non-draft,
      # non-prerelease BMC-UI release. On the schedule, compare with what the
      # site already serves and stop if they agree -- a deploy of the same
      # bytes every hour is noise in the deployment history.
      - name: latest BMC-UI release
        id: ui
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag=$(gh api repos/excavador-turing/BMC-UI/releases/latest --jq .tag_name)
          live=$(curl -fsS --max-time 15 https://turingpi.xyz/demo/fork/VERSION 2>/dev/null || echo none)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "schedule" ] \
             && [ "$tag" = "$live" ] \
             && [ "${{ needs.refresh.outputs.changed }}" != "true" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "the site already carries $tag and nothing moved; nothing to do"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "building the demo from $tag (the site carries $live)"
          fi

      # The panes are a pure function of the BMC-UI release and the ribbon
      # script, so a docs-only deploy has no reason to rebuild them -- which
      # is most deploys. npm ci plus two Vite builds is 16 of the ~45 seconds
      # left in this job.
      - name: the demo panes, if this release has been built before
        id: demo-cache
        if: steps.ui.outputs.skip != 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            docs/demo/fork
            docs/demo/fleet
          key: demo-${{ steps.ui.outputs.tag }}-${{ hashFiles('scripts/demo-ribbon.py') }}

      - name: BMC-UI at that release
        if: steps.ui.outputs.skip != 'true' && steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: excavador-turing/BMC-UI
          ref: ${{ steps.ui.outputs.tag }}
          path: bmc-ui

      - name: node, as BMC-UI pins it
        if: steps.ui.outputs.skip != 'true' && steps.demo-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: bmc-ui/.nvmrc
          cache: npm
          cache-dependency-path: bmc-ui/package-lock.json

      - name: build the fork demo
        if: steps.ui.outputs.skip != 'true' && steps.demo-cache.outputs.cache-hit != 'true'
        working-directory: bmc-ui
        env:
          VITE_DEMO: "1"
          VITE_BASE: /demo/fork/
          BMC_UI_VERSION: ${{ steps.ui.outputs.tag }}
        run: |
          set -eu
          npm ci --no-audit --no-fund
          npm run build
          # Moved aside immediately: the fleet build below runs `npm run
          # build` again into the same `dist`, and without this the fork
          # pane is quietly replaced by the fleet one. The demo-mode check
          # caught exactly that -- it looked for the console's recording
          # notice in what it thought was the fork bundle, and refused.
          mv dist ../fork-dist

      # Prove the bundle is a demo before publishing it. A release without
      # the demo mode builds just as green and then, framed on the front
      # page, tries to talk to a board that is not there.
      # The fleet interface, from the same release, answering from the same
      # capture. It is a different build of one tree -- the board's page and
      # the page over every board share their data layer by import -- so one
      # release gives the site both, and they cannot drift apart.
      - name: build the fleet demo
        if: steps.ui.outputs.skip != 'true' && steps.demo-cache.outputs.cache-hit != 'true'
        working-directory: bmc-ui
        env:
          VITE_APP: fleet
          VITE_DEMO: "1"
          VITE_BASE: /demo/fleet/
          BMC_UI_VERSION: ${{ steps.ui.outputs.tag }}
          # The fleet header reads import.meta.env.VITE_BMC_UI_VERSION; Vite
          # only exposes VITE_-prefixed variables, so without this the demo's
          # fleet says "dev" -- the same slip Dockerfile.fleet had until 3.31.0.
          VITE_BMC_UI_VERSION: ${{ steps.ui.outputs.tag }}
        run: |
          set -eu
          npm run build
          mv dist ../fleet-dist

      - name: place it and give it a way out
        if: steps.ui.outputs.skip != 'true' && steps.demo-cache.outputs.cache-hit != 'true'
        run: |
          set -eu
          rm -rf docs/demo/fork
          mkdir -p docs/demo/fork
          cp -a fork-dist/. docs/demo/fork/
          echo "${{ steps.ui.outputs.tag }}" > docs/demo/fork/VERSION
          rm -rf docs/demo/fleet
          mkdir -p docs/demo/fleet
          cp -a fleet-dist/. docs/demo/fleet/
          echo "${{ steps.ui.outputs.tag }}" > docs/demo/fleet/VERSION
          # The board list the demo shows. Both cards answer from ONE board's
          # capture, which the demo page says out loud -- inventing a second
          # board's readings would be the first thing on this site that was
          # not measured.
          cat > docs/demo/fleet/config.json <<'JSON'
          {
            "boards": [
              { "id": "bmc-1", "name": "bmc-1 (board A)", "note": "hive-1 … hive-4" },
              { "id": "bmc-2", "name": "bmc-2 (board B)", "note": "hive-5 … hive-8" }
            ],
            "supportedBmcd": { "min": "2.20.0", "max": "2.34.0" }
          }
          JSON
          python3 scripts/demo-ribbon.py
          echo "fork pane: ${{ steps.ui.outputs.tag }} ($(find docs/demo/fork -type f | wc -l) files)"
          echo "fleet pane: ${{ steps.ui.outputs.tag }} ($(find docs/demo/fleet -type f | wc -l) files)"

      # Prove the panes are demos before publishing them, INCLUDING when
      # they came out of the cache -- a cache is a thing that can be wrong,
      # and this is the check that stops a bundle which would try to reach
      # real boards from a public page. The string lives inside
      # `import.meta.env.VITE_DEMO === "1"`, which Vite replaces statically,
      # so a build without demo mode eliminates it.
      - name: both panes are demos
        if: steps.ui.outputs.skip != 'true'
        run: |
          set -eu
          for pane in fork fleet; do
            if ! grep -rqlF "a recording, not a live stream" "docs/demo/$pane/assets"; then
              echo "${{ steps.ui.outputs.tag }} $pane built without its demo mode; refusing to publish it as one" >&2
              exit 1
            fi
            echo "$pane pane: $(cat docs/demo/$pane/VERSION), $(find docs/demo/$pane -type f | wc -l) files"
          done

      - uses: astral-sh/setup-uv@e92bafb6253dcd438e0484186d7669ea7a8ca1cc # v6.4.3
        if: steps.ui.outputs.skip != 'true'
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: install
        if: steps.ui.outputs.skip != 'true'
        run: |
          uv venv
          uv pip install -r requirements.txt

      - name: build, strict
        if: steps.ui.outputs.skip != 'true'
        run: .venv/bin/mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.ui.outputs.skip != 'true'
        with:
          path: site

  deploy:
    # Deploy is main-only: a push to main, a dispatch from a BMC-UI
    # release, the hourly catch-up when it found something new, or a hand on
    # the button. Pull requests do not reach this workflow at all any more --
    # they run `checks.yml`, which publishes nothing.
    #
    # `!cancelled()` is load-bearing and its absence cost a silent
    # non-deploy. `refresh` above runs only on the schedule, so on a push it
    # is SKIPPED; `build` tolerates that with its own guard and succeeds. A
    # downstream job without a guard of its own inherits the skip from a
    # transitive dependency, so this one was skipped while the run reported
    # success -- main moved, the build went green, and the site did not
    # change. `needs.build.result` is then checked explicitly, because
    # `!cancelled()` would otherwise let a deploy follow a FAILED build.
    if: ${{ !cancelled()
            && needs.build.result == 'success'
            && github.ref == 'refs/heads/main'
            && needs.build.outputs.skip != 'true' }}
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # A deploy that does not happen must not report success.
  #
  # This is here because one already did: `deploy` inherited a skip from a
  # transitive dependency, the run went green, main carried a rewritten site
  # and turingpi.xyz served the old one. Nothing in the run said so -- every
  # job was either success or skipped, which is what a green tick means.
  published:
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    needs: [build, deploy]
    runs-on: ubuntu-latest
    steps:
      - name: the site was actually published
        env:
          BUILD: ${{ needs.build.result }}
          SKIP: ${{ needs.build.outputs.skip }}
          DEPLOY: ${{ needs.deploy.result }}
        run: |
          set -eu
          if [ "$SKIP" = "true" ]; then
            echo "build decided there was nothing to publish; deploy: $DEPLOY"
            exit 0
          fi
          if [ "$BUILD" != "success" ]; then
            echo "build did not succeed ($BUILD); nothing to publish" >&2
            exit 1
          fi
          if [ "$DEPLOY" != "success" ]; then
            echo "build produced a site and deploy did not run ($DEPLOY)." >&2
            echo "main has moved and turingpi.xyz has not. Check the deploy" >&2
            echo "job's condition -- a skipped transitive dependency is how" >&2
            echo "this happened the first time." >&2
            exit 1
          fi
          echo "published"
