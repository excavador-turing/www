name: Site

# Everything that judges turingpi.xyz, and nothing that publishes it:
# publish.yaml publishes, and runs these gates again with the demo panes in
# place before it does.
#
# The judging used to live inside the deploy. The screen gate alone was 132
# of the 178 seconds a deploy took, while building the site took 3 -- so
# publishing a typo waited two minutes on a browser measuring pages that had
# not changed. Worse, a layout regression should stop a merge, not a
# publish: by the time a publish runs, the change is already on main.
#
#   build    the sources: the facts file, numbers typed instead of asked
#            for, the feature pages' shape, the captures. Then a strict
#            build (no warning, no broken internal link, no LFS pointer),
#            and what was built: descriptions, structured data, llms.txt,
#            internal links, click depth, and every URL the site has served.
#   screens  every page at nine viewports in headless Chrome: nothing
#            clipped, nothing stretched, every screen fits.
#
# `just check` runs the same things locally, in the same order. Make both
# jobs required on main: they are what stands between a bad page and the
# live site.
on:
  pull_request:
  workflow_dispatch:
  # On main as a canary: if a check fails there, something reached main
  # without passing, and the run is the record of it.
  push:
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Images and fonts are Git LFS objects (.gitattributes). Without
          # this the build succeeds and publishes the pointers as the images;
          # check-built.sh refuses that, and this prevents it.
          lfs: true
          # Each page's "last updated" date is its newest commit; a shallow
          # clone would date every page today.
          fetch-depth: 0
          persist-credentials: false

      # The toolchain is devbox.json's -- node, yarn, Python -- so CI and a
      # workstation build with the same versions.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.4

      - name: the facts file matches its sources
        run: devbox run -- python3 scripts/facts.py --check

      - name: no page types a number the facts file owns
        run: devbox run -- python3 scripts/facts-lint.py

      - name: the feature pages have one shape
        run: devbox run -- python3 scripts/feature-lint.py

      - name: no capture carries the demo ribbon
        run: devbox run -- python3 scripts/crop-ribbon.py --check

      - name: build strictly, stamp, check what was built
        run: devbox run -- just build

      # The source rules, then each built page carries its description whole
      # and escaped.
      - name: every page says what it is for, and says it whole
        run: devbox run -- python3 scripts/description-lint.py --site starlight/dist

      - name: the structured data parses, and carries real values
        run: devbox run -- python3 scripts/structured-data.py --strict

      - name: llms.txt matches the nav, is served as written, and its links land
        run: devbox run -- python3 scripts/llms.py --check --site starlight/dist

      # Beside starlight-links-validator, which checks the content's links:
      # this resolves every href and src in the HTML, header, footer and
      # components included.
      - name: every internal link lands on a file
        run: devbox run -- python3 scripts/internal-links.py

      - name: every page is within two clicks of the front page
        run: devbox run -- python3 scripts/reach.py

      - name: every URL the site has served still answers
        run: devbox run -- python3 scripts/served-urls.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starlight-dist
          path: starlight/dist
          if-no-files-found: error
          retention-days: 7

  screens:
    needs: build
    # Downstream of a job that may be skipped or cancelled: run only on a
    # build that actually succeeded, never on a skip inherited from it.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The script and its baseline; the images it measures are dist's,
      # which the build job made from the LFS objects.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the pinned websockets in requirements.txt. Chrome is the
      # runner's own.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: starlight-dist
          path: starlight/dist

      - name: every screen fits, nothing clipped, nothing stretched
        run: devbox run -- python3 scripts/screens.py --json screens.json

      - name: the measurements, if anything failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: screens.json
          if-no-files-found: ignore
