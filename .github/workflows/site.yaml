name: Site (Starlight)

# The Starlight build of turingpi.xyz, proved on every pull request and on
# main. There is no deploy job here on purpose: publish.yaml publishes, with
# the demo panes and the same gates. `checks.yml` still judges the MkDocs
# build, which stays until MkDocs is retired as parity's reference.
#
# Phase 3: every check the MkDocs build passes runs here against this build,
# and parity with the live site is a gate. `just site-check` runs the same
# things locally, in the same order.
#
#   build    the source checks both builds share; render docs/ into
#            starlight/, a strict Astro build (no warning, no broken internal
#            link, no LFS pointer); then the checks of what was built --
#            descriptions, structured data, llms.txt, internal links, click
#            depth. Also the MkDocs build of the same commit, which parity
#            needs to tell a port fault from content that moved;
#   screens  every page at nine viewports in headless Chrome: nothing
#            clipped, nothing stretched, every screen fits;
#   parity   every URL, asset (sha256), head tag and anchor the MkDocs build
#            of the same commit serves, against this build. Fails on
#            anything not in the script's list of deliberate fixes. The job
#            summary is the report.
on:
  pull_request:
  workflow_dispatch:
  # On main as a canary: if the build breaks there, something reached main
  # without passing.
  push:
    branches: [main]

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Images and fonts are Git LFS objects (.gitattributes). Without
          # this the build succeeds and publishes the pointers as the images;
          # check-built.sh refuses that, and this prevents it.
          lfs: true
          # Each page's "last updated" date is its source file's last commit;
          # a shallow clone would date every page today.
          fetch-depth: 0
          persist-credentials: false

      # The toolchain is devbox.json's -- node, yarn, Python for the
      # converter -- so CI and a workstation build with the same versions.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.4

      # The sources both builds read, judged by the MkDocs checks
      # unchanged. checks.yml runs them too; they are here as well so this
      # workflow stands alone when checks.yml goes (phase 4).
      - name: the facts file matches its sources
        run: devbox run -- python3 scripts/facts.py --check

      - name: no page types a number the facts file owns
        run: devbox run -- python3 scripts/facts-lint.py

      - name: the feature pages have one shape
        run: devbox run -- python3 scripts/feature-lint.py

      - name: no capture carries the demo ribbon
        run: devbox run -- python3 scripts/crop-ribbon.py --check

      - name: convert, build strictly, check what was built
        run: devbox run -- just site-build

      # The source rules, then each built page carries its description whole
      # and escaped: MkDocs's template cuts two posts at a `"` today.
      - name: every page says what it is for, and says it whole
        run: devbox run -- python3 scripts/description-lint.py --site starlight/dist

      # --strict: no template left unrendered in the data, and no description
      # that disagrees with the meta tag -- the two faults MkDocs ships.
      - name: the structured data parses, and carries real values
        run: devbox run -- python3 scripts/structured-data.py --site starlight/dist --strict

      - name: llms.txt matches the nav, is served as written, and its links land
        run: devbox run -- python3 scripts/llms.py --check --site starlight/dist

      # Beside starlight-links-validator, which checks the content's links:
      # this resolves every href and src in the HTML, header, footer and
      # components included -- Starlight's /favicon.svg among them.
      - name: every internal link lands on a file
        run: devbox run -- python3 scripts/internal-links.py --site starlight/dist

      - name: every page is within two clicks of the front page
        run: devbox run -- python3 scripts/reach.py --site starlight/dist

      # Parity's reference: the live site is the Starlight build itself
      # since the switch, and cannot tell the port from itself.
      - name: the MkDocs build of this commit
        run: devbox run -- mkdocs build --strict

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: starlight-dist
          path: starlight/dist
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mkdocs-site
          path: site
          if-no-files-found: error
          retention-days: 7

  screens:
    needs: build
    # Downstream of a job that may be skipped or cancelled: run only on a
    # build that actually succeeded, never on a skip inherited from it.
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The script and its baseline; the images it measures are dist's,
      # which the build job made from the LFS objects.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # For the pinned websockets in requirements.txt. Chrome is the
      # runner's own, as in checks.yml.
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
          devbox-version: 0.18.4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: starlight-dist
          path: starlight/dist

      - name: every screen fits, nothing clipped, nothing stretched
        run: devbox run -- python3 scripts/screens.py --site starlight/dist --json screens.json

      - name: the measurements, if anything failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: screens
          path: screens.json
          if-no-files-found: ignore

  parity:
    needs: build
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # The parity script and `git lfs ls-files` (which LFS files to compare)
      # need the tree, not the LFS objects: the bytes compared are dist's.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: starlight-dist
          path: starlight/dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: mkdocs-site
          path: site

      # Standard library only, so the runner's own Python will do.
      - name: every URL, asset, head tag and anchor the MkDocs build serves
        run: python3 scripts/url-parity.py --strict --reference site --markdown "$GITHUB_STEP_SUMMARY" --json parity.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: ${{ !cancelled() }}
        with:
          name: url-parity
          path: parity.json
          if-no-files-found: ignore
